[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-experiment-platform"
version = "0.1.0"
description = "Batch-recorded statistical tests with resumable permutation inference"
requires-python = ">=3.11"

[project.scripts]
stat-platform = "stat_platform.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_classes = "Check"
